[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rola-results"
version = "0.1.0"
description = "The interface every rola tool stores its measurements through; records in this repository by default"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["rola_results"]
